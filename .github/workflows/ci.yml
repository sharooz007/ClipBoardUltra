name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build with Swift Package Manager
        run: swift build -c release

      - name: Verify Bundle Assembly Script
        run: |
          chmod +x scripts/build.sh
          NO_LAUNCH=1 ./scripts/build.sh
