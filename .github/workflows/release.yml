name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcode-select -p
          swift --version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Application & Generate DMG
        run: |
          chmod +x scripts/build.sh scripts/create_dmg.sh
          NO_LAUNCH=1 ./scripts/build.sh
          ./scripts/create_dmg.sh ClipBoardUltra.dmg
          ./scripts/create_dmg.sh ClipBoardUltra-Intel-x86_64.dmg

      - name: Generate Checksum
        run: |
          shasum -a 256 ClipBoardUltra.dmg > ClipBoardUltra.dmg.sha256
          shasum -a 256 ClipBoardUltra-Intel-x86_64.dmg > ClipBoardUltra-Intel-x86_64.dmg.sha256
          cat ClipBoardUltra.dmg.sha256
          cat ClipBoardUltra-Intel-x86_64.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipBoardUltra.dmg
            ClipBoardUltra.dmg.sha256
            ClipBoardUltra-Intel-x86_64.dmg
            ClipBoardUltra-Intel-x86_64.dmg.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
